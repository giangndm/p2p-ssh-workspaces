[package]
name = "ssh-workspaces"
version = "0.1.1"
edition = "2024"
description = "P2P iroh pipe for OpenSSH"
repository = "https://github.com/giangndm/p2p-ssh-workspaces"
publish = false
autobins = false

[[bin]]
name = "sshp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
iroh = "1.1.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
