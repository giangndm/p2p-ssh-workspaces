[package]
name = "ssh-workspaces"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "sshp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["as_ref", "display", "from", "into"] }
iroh = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
